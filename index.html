<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Narzędzie do wizualizacji i edycji obiektów 3D</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        html, body {margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;}
        #appcontainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #cesiumContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        #three-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        #editor-panel {
            position: absolute;
            z-index: 20;
            top: 10px;
            left: 10px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        #editor-panel button {
            padding: 6px 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
<div id="appcontainer">
    <div id="cesiumContainer"></div>
    <canvas id="three-container"></canvas>
    <lower-bar title="Gaussian Splatting Viewer"></lower-bar>
    <import-box title="Dodaj pliki projektu"></import-box>
    <file-list id="file-list"></file-list>
</div>
<script type="module" src="./main.js"></script>
</body>
</html>
