<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Narzędzie do wizualizacji i edycji obiektów 3D</title>
    <link href="https://cesium.com/downloads/cesiumjs/releases/1.116/Build/Cesium/Widgets/widgets.css" rel="stylesheet">
    <style>
        html, body {margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;}
        #appcontainer {
            position: relative;
            width: 100%;
            height: 100%;
        }
        #cesiumContainer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            color: black
        }
        #deck-container {
            position: absolute;
            top: 0;
            left: 0;
            z-index: 10;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="appcontainer">
        <div id="cesiumContainer"></div>
        <canvas id="deck-container"></canvas>
    </div>
    <script type="module" src="./main.js"></script>
    <script src="https://unpkg.com/plyparser@latest/PLYParser.js" type="text/javascript"></script>
</body>
</html>
